{% extends "base.html" %}
{% block title %}Log in · CareSlot{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p class="muted">Account nahi hai? <a href="{% url 'accounts:signup' %}">Create account</a></p>
</div>
{% endblock %}
