{% extends "base.html" %}
{% block title %}Create account · CareSlot{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create your account</h1>
  <form method="post" novalidate>{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Pehle se account hai? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
